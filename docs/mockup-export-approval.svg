<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <style>
    text { font-family: 'Arial', sans-serif; }
    .title { font-size: 14px; font-weight: bold; fill: #fff; }
    .heading { font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-size: 11px; fill: #666; }
    .value { font-size: 11px; fill: #333; }
    .btn-text { font-size: 11px; fill: #fff; font-weight: bold; }
    .small { font-size: 10px; fill: #999; }
  </style>

  <!-- Background -->
  <rect width="900" height="640" fill="#f5f5f5"/>

  <!-- Header -->
  <rect width="900" height="48" fill="#1a237e"/>
  <text x="20" y="30" class="title">DLP 관리 콘솔</text>
  <text x="700" y="30" class="title" style="font-weight:normal; font-size:12px">반출 로그  |  승인 요청  |  통계</text>

  <!-- Page Title -->
  <text x="30" y="80" class="heading">파일 반출 승인 요청</text>

  <!-- Filter Bar -->
  <rect x="20" y="95" width="860" height="50" rx="6" fill="#fff" stroke="#e0e0e0"/>
  <text x="35" y="118" class="label">상태</text>
  <rect x="60" y="105" width="100" height="28" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="70" y="124" class="value">전체 ▼</text>

  <text x="175" y="118" class="label">날짜</text>
  <rect x="200" y="105" width="140" height="28" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="210" y="124" class="value">2024-09-01 ~ 09-15</text>

  <text x="355" y="118" class="label">요청자</text>
  <rect x="395" y="105" width="120" height="28" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="405" y="124" class="value">전체</text>

  <rect x="530" y="105" width="60" height="28" rx="4" fill="#1a237e"/>
  <text x="544" y="124" class="btn-text">검색</text>

  <rect x="600" y="105" width="60" height="28" rx="4" fill="#757575"/>
  <text x="611" y="124" class="btn-text">초기화</text>

  <!-- New Request Button -->
  <rect x="760" y="105" width="110" height="28" rx="4" fill="#2e7d32"/>
  <text x="772" y="124" class="btn-text">+ 새 요청</text>

  <!-- Table -->
  <rect x="20" y="155" width="860" height="380" rx="6" fill="#fff" stroke="#e0e0e0"/>

  <!-- Table Header -->
  <rect x="20" y="155" width="860" height="32" rx="6" fill="#e8eaf6"/>
  <text x="35" y="176" class="label" style="font-weight:bold">번호</text>
  <text x="80" y="176" class="label" style="font-weight:bold">요청자</text>
  <text x="160" y="176" class="label" style="font-weight:bold">부서</text>
  <text x="240" y="176" class="label" style="font-weight:bold">파일명</text>
  <text x="430" y="176" class="label" style="font-weight:bold">크기</text>
  <text x="490" y="176" class="label" style="font-weight:bold">반출방법</text>
  <text x="560" y="176" class="label" style="font-weight:bold">사유</text>
  <text x="700" y="176" class="label" style="font-weight:bold">상태</text>
  <text x="780" y="176" class="label" style="font-weight:bold">관리</text>

  <!-- Row 1 -->
  <line x1="20" y1="220" x2="880" y2="220" stroke="#eee"/>
  <text x="35" y="207" class="value">1</text>
  <text x="80" y="207" class="value">이개발</text>
  <text x="160" y="207" class="value">개발팀</text>
  <text x="240" y="207" class="value">API_설계서_인증모듈.pdf</text>
  <text x="430" y="207" class="value">1.0 MB</text>
  <text x="490" y="207" class="value">클라우드</text>
  <text x="560" y="207" class="value">재택근무 중 참고</text>
  <rect x="695" y="195" width="48" height="18" rx="9" fill="#fff3e0"/>
  <text x="703" y="208" style="font-size:10px; fill:#e65100; font-weight:bold">대기</text>
  <rect x="760" y="194" width="40" height="20" rx="3" fill="#1a237e"/>
  <text x="766" y="208" style="font-size:9px; fill:#fff">승인</text>
  <rect x="805" y="194" width="40" height="20" rx="3" fill="#c62828"/>
  <text x="811" y="208" style="font-size:9px; fill:#fff">반려</text>

  <!-- Row 2 -->
  <line x1="20" y1="255" x2="880" y2="255" stroke="#eee"/>
  <text x="35" y="242" class="value">2</text>
  <text x="80" y="242" class="value">박기획</text>
  <text x="160" y="242" class="value">기획팀</text>
  <text x="240" y="242" class="value">고객요구사항_분석_Q3.docx</text>
  <text x="430" y="242" class="value">512 KB</text>
  <text x="490" y="242" class="value">USB</text>
  <text x="560" y="242" class="value">고객사 미팅 자료</text>
  <rect x="695" y="230" width="48" height="18" rx="9" fill="#e8f5e9"/>
  <text x="703" y="243" style="font-size:10px; fill:#2e7d32; font-weight:bold">승인</text>
  <text x="770" y="243" class="small">2024-09-02 승인됨</text>

  <!-- Row 3 -->
  <line x1="20" y1="290" x2="880" y2="290" stroke="#eee"/>
  <text x="35" y="277" class="value">3</text>
  <text x="80" y="277" class="value">정영업</text>
  <text x="160" y="277" class="value">영업팀</text>
  <text x="240" y="277" class="value">거래처_연락처_목록.csv</text>
  <text x="430" y="277" class="value">15 KB</text>
  <text x="490" y="277" class="value">이메일</text>
  <text x="560" y="277" class="value">신규 영업사원 공유</text>
  <rect x="695" y="265" width="48" height="18" rx="9" fill="#ffebee"/>
  <text x="703" y="278" style="font-size:10px; fill:#c62828; font-weight:bold">반려</text>
  <text x="770" y="278" class="small">개인정보 포함</text>

  <!-- Row 4 -->
  <line x1="20" y1="325" x2="880" y2="325" stroke="#eee"/>
  <text x="35" y="312" class="value">4</text>
  <text x="80" y="312" class="value">서개발</text>
  <text x="160" y="312" class="value">개발팀</text>
  <text x="240" y="312" class="value">source_backup_20240906.tar.gz</text>
  <text x="430" y="312" class="value">50 MB</text>
  <text x="490" y="312" class="value">USB</text>
  <text x="560" y="312" class="value">개인 백업</text>
  <rect x="695" y="300" width="48" height="18" rx="9" fill="#fff3e0"/>
  <text x="703" y="313" style="font-size:10px; fill:#e65100; font-weight:bold">대기</text>
  <rect x="760" y="299" width="40" height="20" rx="3" fill="#1a237e"/>
  <text x="766" y="313" style="font-size:9px; fill:#fff">승인</text>
  <rect x="805" y="299" width="40" height="20" rx="3" fill="#c62828"/>
  <text x="811" y="313" style="font-size:9px; fill:#fff">반려</text>

  <!-- Row 5 (large file highlight) -->
  <rect x="20" y="325" width="860" height="35" fill="#fff8e1" opacity="0.5"/>
  <line x1="20" y1="360" x2="880" y2="360" stroke="#eee"/>
  <text x="35" y="347" class="value">5</text>
  <text x="80" y="347" class="value">최디자</text>
  <text x="160" y="347" class="value">디자인팀</text>
  <text x="240" y="347" class="value">프로토타입_데모영상.mp4</text>
  <text x="430" y="347" style="font-size:11px; fill:#e65100; font-weight:bold">30 MB</text>
  <text x="490" y="347" class="value">클라우드</text>
  <text x="560" y="347" class="value">고객사 데모</text>
  <rect x="695" y="335" width="48" height="18" rx="9" fill="#fff3e0"/>
  <text x="703" y="348" style="font-size:10px; fill:#e65100; font-weight:bold">대기</text>
  <rect x="760" y="334" width="40" height="20" rx="3" fill="#1a237e"/>
  <text x="766" y="348" style="font-size:9px; fill:#fff">승인</text>
  <rect x="805" y="334" width="40" height="20" rx="3" fill="#c62828"/>
  <text x="811" y="348" style="font-size:9px; fill:#fff">반려</text>

  <!-- Annotation: large file -->
  <text x="435" y="370" style="font-size:9px; fill:#e65100">* 대용량 파일은 별도 표시</text>

  <!-- Pagination -->
  <rect x="370" y="505" width="28" height="26" rx="4" fill="#1a237e"/>
  <text x="380" y="523" style="font-size:11px; fill:#fff">1</text>
  <rect x="402" y="505" width="28" height="26" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="412" y="523" class="value">2</text>
  <rect x="434" y="505" width="28" height="26" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="444" y="523" class="value">3</text>
  <rect x="466" y="505" width="28" height="26" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="476" y="523" class="value">...</text>
  <rect x="498" y="505" width="28" height="26" rx="4" fill="#fff" stroke="#ccc"/>
  <text x="506" y="523" class="value">10</text>

  <!-- Wireframe note -->
  <rect x="20" y="550" width="860" height="70" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-dasharray="4"/>
  <text x="35" y="572" style="font-size:12px; fill:#f57f17; font-weight:bold">참고 — 이 시안은 와이어프레임입니다</text>
  <text x="35" y="590" style="font-size:11px; fill:#666">• 대략적인 레이아웃과 기능 배치를 보여줍니다. 세부 디자인은 지원자가 판단하세요.</text>
  <text x="35" y="606" style="font-size:11px; fill:#666">• 시안과 다르게 구현한 부분이 있다면 DECISIONS.md에 이유를 기록해 주세요.</text>
</svg>
